name: BRREG Sync

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        type: choice
        options:
          - full
          - incremental
        default: incremental
      max_parallel:
        description: 'Max parallel jobs'
        type: number
        default: 5

# Ensure only one sync runs at a time
concurrency:
  group: brreg-sync
  cancel-in-progress: false

permissions:
  id-token: write   # Required for OIDC (AWS and GCP Workload Identity)
  contents: read

env:
  STORAGE_PATH: ${{ vars.BRREG_STORAGE_PATH || 's3://brreg-regnskap/data' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      mode: ${{ steps.gen.outputs.mode }}
      provider: ${{ steps.detect.outputs.provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect storage provider
        id: detect
        run: |
          if [[ "$STORAGE_PATH" == gs://* ]]; then
            echo "provider=gcs" >> "$GITHUB_OUTPUT"
          else
            echo "provider=s3" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.detect.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: steps.detect.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ steps.detect.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Generate matrix
        id: gen
        run: |
          uv run python scripts/generate_matrix.py \
            --storage-path "$STORAGE_PATH" \
            --mode "${{ inputs.mode || 'incremental' }}"

  process:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '5') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Sync shard
        run: |
          uv run brreg-regnskap sync "$STORAGE_PATH" \
            --mode ${{ needs.plan.outputs.mode }} \
            --range-start "${{ matrix.start }}" \
            --range-end "${{ matrix.end }}" \
            --max-runtime 300 \
            --log-level INFO

  merge:
    needs: [plan, process]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Merge shard manifests
        run: uv run brreg-regnskap merge-manifests "$STORAGE_PATH"
