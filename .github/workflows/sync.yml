name: BRREG Sync

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        type: choice
        options:
          - sync
          - setup
          - patch
        default: sync

# Ensure only one sync runs at a time
concurrency:
  group: brreg-sync
  cancel-in-progress: false

permissions:
  id-token: write   # Required for OIDC (AWS and GCP Workload Identity)
  contents: read

env:
  STORAGE_PATH: ${{ vars.BRREG_STORAGE_PATH || 'gs://brreg-regnskap/data' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      provider: ${{ steps.detect.outputs.provider }}
      command: ${{ steps.cmd.outputs.command }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect storage provider
        id: detect
        run: |
          if [[ "$STORAGE_PATH" == gs://* ]]; then
            echo "provider=gcs" >> "$GITHUB_OUTPUT"
          else
            echo "provider=s3" >> "$GITHUB_OUTPUT"
          fi

      - name: Set command
        id: cmd
        run: echo "command=${{ inputs.command || 'sync' }}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Generate matrix
        id: gen
        run: |
          uv sync --frozen
          uv run python scripts/generate_matrix.py --storage-path "$STORAGE_PATH"

  # Setup runs as a single job (downloads bulk dump, seeds orderflow)
  setup:
    needs: plan
    if: needs.plan.outputs.command == 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Run setup
        run: uv run brreg-regnskap setup "$STORAGE_PATH"

  # Patch runs as a single job (polls BRREG updates API)
  patch:
    needs: plan
    if: needs.plan.outputs.command == 'patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Run patch
        run: uv run brreg-regnskap patch "$STORAGE_PATH"

  # Sync runs in parallel across 10 shards
  sync:
    needs: plan
    if: needs.plan.outputs.command == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Sync shard
        run: |
          uv run brreg-regnskap sync "$STORAGE_PATH" \
            --shard ${{ matrix.shard }} \
            --max-runtime 300 \
            --log-level INFO

  # Merge shard manifests after all sync jobs complete
  merge:
    needs: [plan, sync]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.command == 'sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- AWS ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.plan.outputs.provider == 's3'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # --- GCS ---
      - uses: google-github-actions/auth@v2
        if: needs.plan.outputs.provider == 'gcs'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: |
          if [[ "${{ needs.plan.outputs.provider }}" == "gcs" ]]; then
            uv sync --frozen --extra gcs
          else
            uv sync --frozen --extra s3
          fi

      - name: Merge shard manifests
        run: uv run brreg-regnskap merge-manifests "$STORAGE_PATH"
